<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10">
  <!-- A frame's fill: a nine-patch, a rounded rectangle of radius 3 within 4-pixel corners (a straight pixel before
       the 2-pixel middle). -->
  <rect x="0" y="0" width="10" height="10" rx="3" ry="3" fill="#ffffff"/>
</svg>
